<div class="min-h-screen flex flex-col">
  <nav class="bg-purple-600 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-50">
    <a routerLink="/" class="text-xl font-bold text-white no-underline">LinkTree</a>
    <div class="flex gap-4 items-center">
      @if (authService.isLoggedIn()) {
        <a routerLink="/dashboard" routerLinkActive="active" class="text-white no-underline px-3 py-1 rounded hover:bg-white/20 transition">Dashboard</a>
        <a routerLink="/profile" routerLinkActive="active" class="text-white no-underline px-3 py-1 rounded hover:bg-white/20 transition">Profile</a>
        <button class="px-3 py-1 border border-white rounded bg-transparent text-white cursor-pointer hover:bg-white/20 transition" (click)="logout()">Sign Out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="text-white no-underline px-3 py-1 rounded hover:bg-white/20 transition">Sign In</a>
        <a routerLink="/register" class="bg-white text-purple-600 no-underline px-3 py-1 rounded font-medium" routerLinkActive="active">Sign Up</a>
      }
    </div>
  </nav>

  <main class="flex-1">
    <router-outlet />
  </main>
</div>
