<div class="flex items-center justify-center p-8">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
    <h1 class="text-center text-gray-800 mb-6">Forgot Password</h1>

    @if (!submitted()) {
      <p class="text-gray-600 text-sm mb-4 text-center">Enter your email and we'll send you a link to reset your password.</p>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label for="email" class="block mb-2 text-gray-600 text-sm">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="your@email.com"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-base box-border focus:outline-none focus:border-purple-600"
          />
        </div>
        @if (error()) {
          <div class="text-red-600 text-sm mb-4">{{ error() }}</div>
        }
        <button type="submit" class="w-full py-2 bg-purple-600 text-white border-none rounded-lg text-base cursor-pointer mt-2 hover:bg-purple-700">Send reset link</button>
      </form>
    } @else {
      <div class="text-center">
        <div class="text-green-600 text-sm mb-4">If an account exists for that email, we've sent a password reset link.</div>
        <p class="text-gray-500 text-sm">Check your inbox (and spam folder).</p>
      </div>
    }

    <p class="text-center mt-4 text-gray-500"><a routerLink="/login" class="text-purple-600 no-underline">Back to sign in</a></p>
  </div>
</div>
